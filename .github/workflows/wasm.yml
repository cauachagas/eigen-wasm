# Builds and tests the WebAssembly wrapper in wasm/.
#
# Runs on GitHub Actions rather than GitLab CI: this fork lives at
# github.com/cauachagas/eigen-wasm. Eigen's own .gitlab-ci.yml builds against
# pre-baked GitLab container images and knows nothing about emsdk, so the WASM
# check is kept here instead of being added to that file.
#
# The paths filter covers Eigen/** as well as wasm/**: the wrapper includes
# Eigen/Dense, so an upstream header change can break this build even though no
# file under wasm/ was touched.

name: wasm

on:
  push:
    paths:
      - 'wasm/**'
      - 'Eigen/**'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'wasm/**'
      - 'Eigen/**'
      - '.github/workflows/wasm.yml'

jobs:
  build-and-test:
    name: build and run matMul3x3 tests
    runs-on: ubuntu-latest
    # The emsdk image ships emcc and Node already, so there is nothing to install.
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./wasm/build.sh

      - name: Test
        run: node wasm/test_matmul.js
