name: CI

on:
  push:
    branches: [ master, main, standalone, standalone-filtered ]
  pull_request:
    branches: [ master, main, standalone, standalone-filtered ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Emscripten
        uses: mymind/setup-emscripten@v1
        with:
          version: 3.1.58

      - name: Build WebAssembly Module
        run: npm run build

      - name: Run Test Suites
        run: npm test
